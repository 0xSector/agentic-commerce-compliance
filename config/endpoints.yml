# @purpose: Merchant + endpoint allowlist for the people/identity compliance scope.
# Any tx on an origin listed here is counted. Tighter per-endpoint filtering can
# be layered via `path_keywords` — an endpoint is included only if its path matches
# at least one keyword (case-insensitive substring match).
#
# Set `all: true` to include every endpoint under an origin (used for purebred
# people-search origins like StableEnrich where every endpoint qualifies).

x402:
  - origin: stableenrich.dev
    all: true
  - origin: stablesocial.dev
    path_keywords: [profile, user, username, account, person, search, lookup, identity]
# stableemail.dev intentionally excluded — inspection of endpoints showed it's a
# send-only email service (/api/send, /api/inbox/buy), not a people-lookup API.

# MPP (Tempo) — disabled for now. Re-enable by adding entries; allium.py is
# ready to use once the Allium key issue is resolved.
mpp: []
